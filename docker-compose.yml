name: tiendata

services:
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: tiendata-auth-service
    environment:
      PORT: 3002
      JWT_SECRET: tiendata-dev-secret
      JWT_EXPIRES_IN: 30m
      MAX_LOGIN_ATTEMPTS: 3
      LOCK_TIME_MINUTES: 15
      DEMO_USER_EMAIL: admin@tiendata.com
      DEMO_USER_PASSWORD: Admin1234
      DEMO_USER_NAME: Administrador Demo
      DEMO_USER_ROLE: Administrador
      MS09_AUDIT_WEBHOOK_URL: http://audit-service:3006/api/audit/events
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: tiendata-product-service
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  category-service:
    build:
      context: .
      dockerfile: services/category-service/Dockerfile
    container_name: tiendata-category-service
    environment:
      PORT: 3003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: tiendata-user-service
    environment:
      PORT: 3004
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
      MS09_AUDIT_WEBHOOK_URL: http://audit-service:3006/api/audit/events
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: tiendata-inventory-service
    environment:
      PORT: 3005
      AUTH_SERVICE_URL: http://auth-service:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
      MS06_MOVEMENT_WEBHOOK_URL: ""
      MS09_MOVEMENT_WEBHOOK_URL: http://audit-service:3006/api/audit/events
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  audit-service:
    build:
      context: .
      dockerfile: services/audit-service/Dockerfile
    container_name: tiendata-audit-service
    environment:
      PORT: 3006
      AUTH_SERVICE_URL: http://auth-service:3002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  export-service:
    build:
      context: .
      dockerfile: services/export-service/Dockerfile
    container_name: tiendata-export-service
    environment:
      PORT: 3007
      AUTH_SERVICE_URL: http://auth-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      AUDIT_SERVICE_URL: http://audit-service:3006
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_started
      inventory-service:
        condition: service_started
      audit-service:
        condition: service_started
      supplier-service:
        condition: service_started
    restart: unless-stopped

  supplier-service:
    build:
      context: .
      dockerfile: services/supplier-service/Dockerfile
    container_name: tiendata-supplier-service
    environment:
      PORT: 3008
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  config-service:
    build:
      context: .
      dockerfile: services/config-service/Dockerfile
    container_name: tiendata-config-service
    environment:
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  barcode-service:
    build:
      context: .
      dockerfile: services/barcode-service/Dockerfile
    container_name: tiendata-barcode-service
    environment:
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: tiendata
      DB_NAME: tiendata
    ports:
      - "3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: tiendata-api-gateway
    environment:
      LOGIN_MAX_FALLOS_POR_IP: 20
      LOGIN_VENTANA_MINUTOS: 15
      PORT: 3000
      AUTH_SERVICE_URL: http://auth-service:3002
      PRODUCT_SERVICE_URL: http://product-service:3001
      CATEGORY_SERVICE_URL: http://category-service:3003
      USER_SERVICE_URL: http://user-service:3004
      INVENTORY_SERVICE_URL: http://inventory-service:3005
      AUDIT_SERVICE_URL: http://audit-service:3006
      EXPORT_SERVICE_URL: http://export-service:3007
      PROVIDER_SERVICE_URL: http://supplier-service:3008
      SUPPLIER_SERVICE_URL: http://supplier-service:3008
      CONFIG_SERVICE_URL: http://config-service:3009
      BARCODE_SERVICE_URL: http://barcode-service:3010
    ports:
      - "3000:3000"
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      category-service:
        condition: service_started
      user-service:
        condition: service_started
      inventory-service:
        condition: service_started
      audit-service:
        condition: service_started
      export-service:
        condition: service_started
      supplier-service:
        condition: service_started
      config-service:
        condition: service_started
      barcode-service:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: tiendata-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tiendata
      POSTGRES_DB: tiendata
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tiendata"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - tiendata_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  tiendata_pg_data: